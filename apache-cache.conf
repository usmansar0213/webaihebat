# Cache & kompresi untuk aset statis AIHebat
<IfModule mod_expires.c>
  ExpiresActive On

  # Gambar & font: jarang berubah, nama file stabil
  ExpiresByType image/webp              "access plus 1 year"
  ExpiresByType image/png               "access plus 1 year"
  ExpiresByType image/jpeg              "access plus 1 year"
  ExpiresByType image/svg+xml           "access plus 1 year"
  ExpiresByType image/x-icon            "access plus 1 year"
  ExpiresByType font/woff2              "access plus 1 year"
  ExpiresByType font/woff               "access plus 1 year"

  # CSS & JS: main.* sudah pakai cache-buster ?v=
  ExpiresByType text/css                "access plus 30 days"
  ExpiresByType application/javascript  "access plus 30 days"
  ExpiresByType text/javascript         "access plus 30 days"

  # HTML: selalu revalidasi supaya perubahan konten langsung terlihat
  ExpiresByType text/html               "access plus 0 seconds"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(webp|png|jpe?g|gif|svg|ico|woff2?)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(css|js)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  <FilesMatch "\.(html|php)$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
  # Jangan pernah sajikan file sensitif
  <FilesMatch "^(\.env.*|.*\.ya?ml|Dockerfile|.*\.ps1|.*\.bat)$">
    Require all denied
  </FilesMatch>
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
    application/javascript text/javascript application/json \
    application/xml image/svg+xml
</IfModule>
